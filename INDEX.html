<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeProp México - Inmuebles y Terrenos Ejidales</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div>
            <h1>SafeProp MX</h1>
            <div id="userInfoNav" class="user-info">Sesión: No registrado</div>
        </div>
        <div class="nav-tabs">
            <button onclick="switchTab('registroTab')" id="btnRegistroTab" class="active">Registro / Login</button>
            <button onclick="switchTab('publicarTab')">Publicar Inmueble</button>
            <button onclick="switchTab('catalogoTab')">Ver Catálogo</button>
        </div>
    </nav>

    <div class="container">

        <div id="registroTab" class="tab-content active card">
            <h2>Registro de Usuario (Comprador / Vendedor)</h2>
            <form id="formRegistro" onsubmit="registrarUsuario(event)">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="regNombre">Nombre Completo:</label>
                        <input type="text" id="regNombre" required placeholder="Ej. Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="regRFC">RFC (Validación Oficial):</label>
                        <input type="text" id="regRFC" maxlength="13" style="text-transform:uppercase" required placeholder="Ej. PERJ880101XXX">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="regTel">Teléfono de Contacto (WhatsApp):</label>
                        <input type="tel" id="regTel" required placeholder="Ej. 3312345678">
                    </div>
                    <div class="form-group">
                        <label for="regTipo">Tipo de Perfil:</label>
                        <select id="regTipo" required>
                            <option value="Vendedor/Propietario">Vendedor / Ejidatario</option>
                            <option value="Comprador">Comprador</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Registrar y Comenzar</button>
            </form>
        </div>

        <div id="publicarTab" class="tab-content card">
            <h2>Publicar Casa, Edificio o Terreno Ejidal</h2>
            <form id="formPublicar" onsubmit="publicarInmueble(event)">
                <div class="form-group">
                    <label for="pubTitulo">Título de la Publicación:</label>
                    <input type="text" id="pubTitulo" placeholder="Ej. Terreno Ejidal con Uso de Suelo Agrícola" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="tipo">Tipo de inmueble:</label>
                        <select id="tipo" name="tipo" required>
                            <option value="Casa">Casa</option>
                            <option value="Terreno">Terreno</option>
                            <option value="Departamento">Departamento</option>
                            <option value="Local comercial">Local comercial</option>
                            <option value="Edificio">Edificio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pubEstado">Estado de la República:</label>
                        <select id="pubEstado" required>
                            <option value="Jalisco">Jalisco</option>
                            <option value="Ciudad de México">Ciudad de México</option>
                            <option value="Nuevo León">Nuevo León</option>
                            <option value="Estado de México">Estado de México</option>
                            <option value="Guanajuato">Guanajuato</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="ubicacion">Ubicación exacta o Colonia:</label>
                        <input id="ubicacion" name="ubicacion" required maxlength="200" placeholder="Ej. Av. Patria #123, Zapopan">
                    </div>
                    <div class="form-group">
                        <label for="superficie">Superficie en m²:</label>
                        <input id="superficie" name="superficie" type="number" min="0.01" step="0.01" required placeholder="0.00">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="precio">Precio en MXN:</label>
                        <input id="precio" name="precio" type="number" min="1" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="pubDocumento">Documento de Soporte (Legalidad):</label>
                        <select id="pubDocumento" required>
                            <option value="Escritura Pública RPP">Escritura Pública (Urbano)</option>
                            <option value="Certificado Parcelario RAN">Certificado Parcelario / RAN (Ejidal)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pubFoto">Fotografía Principal del Inmueble:</label>
                    <input type="file" id="pubFoto" accept="image/*" onchange="mostrarVistaPrevia(event)">
                    <img id="vistaPrevia" class="img-preview" alt="Vista previa de la foto">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3" maxlength="5000" placeholder="Detalla las características, estatus legal y confirma si cuentas con el Derecho del Tanto..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Enviar para revisión</button>
                <p id="mensaje-formulario" role="status" style="margin-top: 10px; font-weight: bold;"></p>
            </form>
        </div>

        <div id="catalogoTab" class="tab-content card">
            <h2>Propiedades Verificadas Disponibles</h2>

            <div class="filter-box">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="filtroEstado">Filtrar por Región (Estado):</label>
                        <select id="filtroEstado" onchange="aplicarFiltros()">
                            <option value="TODOS">Todos los Estados</option>
                            <option value="Jalisco">Jalisco</option>
                            <option value="Ciudad de México">Ciudad de México</option>
                            <option value="Nuevo León">Nuevo León</option>
                            <option value="Estado de México">Estado de México</option>
                            <option value="Guanajuato">Guanajuato</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filtroPrecio">Precio Máximo (MXN):</label>
                        <input type="number" id="filtroPrecio" placeholder="Sin límite" oninput="aplicarFiltros()">
                    </div>
                </div>
            </div>

            <div id="listaPropiedades" class="properties-grid"></div>
        </div>

    </div>

    <script src="script.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</body>
</html>
